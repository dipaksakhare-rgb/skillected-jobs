# Render.com blueprint — one-click deploy for Skillected Jobs.
# Deploy: push to GitHub → Render Dashboard → New → Blueprint → select repo.
# NOTE: runs on the FREE tier (no credit card needed). Free instances have no
# persistent disks, so the SQLite DB lives on ephemeral storage: every redeploy
# or restart rebuilds it from migrations and re-crawls all sources (accounts/
# resumes do not survive a redeploy). Upgrade to the $7/mo Starter plan + disk
# for always-on, persistent storage (see docs/09-DEPLOYMENT.md).
services:
  - type: web
    name: skillected-jobs
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/start_prod.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: APP_ENV
        value: production
      - key: APP_BASE_URL
        sync: false        # set to your https://<app>.onrender.com after first deploy
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTO_REGISTER_SOURCES
        value: "1"
      - key: INITIAL_CRAWL
        value: "1"
