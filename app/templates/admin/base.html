<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin — Skillected Jobs{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="/admin" class="brand"><span class="brand-mark">S</span> <span class="brand-text">SKILLECTED <strong>ADMIN</strong></span></a>
    <div class="header-actions">
      {% if session %}<span class="muted small">{{ session.email }}</span>{% endif %}
      <a href="/" class="btn btn-ghost btn-sm">View site</a>
      <a href="/admin/logout" class="btn btn-ghost btn-sm">Logout</a>
    </div>
  </div>
</header>
<main class="site-main container">
  <div class="admin-layout">
    <nav class="admin-nav" aria-label="Admin">
      <a href="/admin">📊 Overview</a>
      <a href="/admin/jobs">🗂 Jobs</a>
      <a href="/admin/crawler">🕷 Crawler</a>
      <a href="/admin/companies">🏢 Companies</a>
      <a href="/admin/sources">🔌 Sources</a>
      <a href="/admin/reports">⚠ Reports{% if pending_review %} <span class="demo-badge">{{ pending_review }}</span>{% endif %}</a>
      <a href="/admin/settings">⚙️ Settings</a>
    </nav>
    <section>{% block admin_content %}{% endblock %}</section>
  </div>
</main>
</body>
</html>
